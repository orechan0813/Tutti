<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5ef">
  <title>Tutti | 部活の毎日を、ひとつに。</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #f3f5ef;
      --surface: #ffffff;
      --ink: #19332f;
      --muted: #78837c;
      --line: #e6eae3;
      --green: #2f7161;
      --green-pale: #e8f2ed;
      --coral: #e97962;
      --yellow: #f1c96a;
      --shadow: 0 12px 35px rgba(37, 61, 51, .06);
      --font: "DM Sans", "Noto Sans JP", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.55; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    .app { min-height: 100vh; }
    .sidebar { width: 252px; position: fixed; inset: 0 auto 0 0; padding: 27px 18px 20px; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 20; transition: transform .24s ease; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 11px 26px; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; background: var(--green); color: #fff; border-radius: 12px; font-size: 19px; font-weight: 800; }
    .brand-name { font-family: "DM Sans", sans-serif; font-size: 23px; line-height: 1; font-weight: 700; letter-spacing: 0; }
    .brand-caption { color: var(--muted); font-size: 10px; margin-top: 4px; }
    .club-switch { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: #fbfcfa; text-align: left; cursor: pointer; margin-bottom: 25px; flex-shrink: 0; }
    .club-avatar { flex: 0 0 34px; height: 34px; border-radius: 9px; background: #f9e3da; color: #b75542; display: grid; place-items: center; font-weight: 700; }
    .club-name { font-weight: 700; font-size: 12px; }
    .club-school { color: var(--muted); font-size: 11px; }
    .club-arrow { margin-left: auto; color: var(--muted); }
    .nav-label { padding: 0 12px 8px; color: #9aa39d; font-size: 10px; font-weight: 700; letter-spacing: .08em; }
    .nav-list { display: grid; gap: 4px; flex: 0 0 auto; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; text-decoration: none; border: 0; border-radius: 8px; background: transparent; color: #65726b; text-align: left; cursor: pointer; font-size: 13px; }
    .nav-item:hover { background: #f6f8f5; color: var(--ink); }
    .nav-item.active { background: var(--green-pale); color: var(--green); font-weight: 700; }
    .nav-icon { width: 18px; text-align: center; font-size: 16px; }
    .nav-divider { height: 1px; background: var(--line); margin: 17px 7px; }
    .nav-badge { margin-left: auto; min-width: 20px; padding: 1px 6px; background: #fbe9e4; color: #b65743; border-radius: 99px; text-align: center; font-size: 10px; font-weight: 700; }
    .sidebar-bottom { margin-top: auto; flex-shrink: 0; }
    .storage-note { display: flex; gap: 9px; align-items: flex-start; margin: 0 5px 16px; padding: 11px; background: #f7f8f5; border-radius: 8px; color: var(--muted); font-size: 10px; }
    .user-row { display: flex; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid var(--line); }
    .user-avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #f5d6c9; color: #784b3d; font-weight: 700; }
    .user-name { font-size: 12px; font-weight: 700; }
    .user-role { color: var(--muted); font-size: 10px; }
    .user-menu { margin-left: auto; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; }
    .main { min-height: 100vh; margin-left: 252px; }
    .topbar { height: 74px; padding: 0 38px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.82); }
    .crumb { color: var(--muted); font-size: 12px; }
    .crumb strong { color: var(--ink); font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .today-label { color: var(--muted); font-size: 12px; }
    .icon-button { width: 36px; height: 36px; border: 1px solid var(--line); background: #fff; border-radius: 9px; cursor: pointer; }
    .icon-button:hover { border-color: #b4c8bd; }
    .mobile-menu { display: none; }
    .content { width: min(1180px, 100%); margin: 0 auto; padding: 31px 38px 55px; }
    .welcome-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    h1 { margin: 4px 0 0; font-size: 25px; line-height: 1.35; letter-spacing: 0; }
    .subheading { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .primary-button, .secondary-button, .quiet-button, .danger-button { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; }
    .primary-button { background: var(--green); border: 1px solid var(--green); color: #fff; }
    .primary-button:hover { filter: brightness(.94); }
    .secondary-button { background: #fff; border: 1px solid var(--line); color: var(--ink); }
    .secondary-button:hover { border-color: #b4c8bd; }
    .quiet-button { min-height: 30px; padding: 0 9px; border: 0; color: var(--green); background: transparent; }
    .danger-button { min-height: 31px; border: 1px solid #f1d7d1; background: #fff8f6; color: #b65743; }
    .grid { display: grid; gap: 16px; }
    .stats-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 17px; }
    .stat-card, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
    .stat-card { min-height: 110px; padding: 16px 18px; }
    .stat-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; }
    .stat-symbol { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 8px; background: var(--green-pale); color: var(--green); }
    .stat-number { margin-top: 8px; font-size: 24px; line-height: 1; font-weight: 700; }
    .stat-foot { margin-top: 6px; color: var(--muted); font-size: 10px; }
    .home-grid { grid-template-columns: minmax(0, 1.5fr) minmax(290px, .92fr); align-items: start; }
    .stack { display: grid; gap: 16px; }
    .panel { overflow: hidden; }
    .panel-head { min-height: 57px; display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; border-bottom: 1px solid var(--line); }
    .panel-title { font-size: 13px; font-weight: 700; }
    .panel-note { color: var(--muted); font-size: 10px; }
    .panel-body { padding: 16px 18px; }
    .practice-card { position: relative; overflow: hidden; background: #214b42; color: white; border-radius: 9px; padding: 19px 20px; }
    .practice-card:after { content: ""; position: absolute; width: 170px; height: 170px; right: -37px; top: -63px; border: 1px solid rgba(255,255,255,.17); border-radius: 50%; box-shadow: 0 0 0 19px rgba(255,255,255,.04), 0 0 0 41px rgba(255,255,255,.035); }
    .practice-date { color: #b8d5c9; font-size: 11px; }
    .practice-title { margin: 6px 0 10px; font-size: 19px; font-weight: 700; }
    .practice-meta { display: flex; flex-wrap: wrap; gap: 16px; color: #e2eee8; font-size: 11px; }
    .practice-meta span { display: flex; gap: 6px; }
    .announcement { display: grid; grid-template-columns: 35px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid #edf0ec; }
    .announcement:first-child { padding-top: 0; }
    .announcement:last-child { padding-bottom: 0; border: 0; }
    .announcement-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: #fff2dc; color: #a97924; }
    .announcement-title { font-size: 12px; font-weight: 700; }
    .announcement-copy { margin-top: 3px; color: #66736c; font-size: 11px; }
    .announcement-date { margin-top: 5px; color: #9aa39d; font-size: 10px; }
    .person-list { display: grid; gap: 12px; }
    .person-row { display: flex; align-items: center; gap: 10px; }
    .mini-avatar { width: 30px; height: 30px; flex: 0 0 30px; display: grid; place-items: center; border-radius: 50%; background: #e6eee8; color: #426556; font-size: 10px; font-weight: 700; }
    .person-info { flex: 1; min-width: 0; }
    .person-name { font-size: 11px; font-weight: 700; }
    .person-detail { color: var(--muted); font-size: 10px; }
    .person-tag { padding: 3px 7px; border-radius: 99px; background: #f4f6f3; color: #718078; font-size: 9px; }
    .meter-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #edf0ec; }
    .meter-row:last-child { border: 0; padding-bottom: 0; }
    .meter-icon { width: 32px; height: 32px; display: grid; place-items: center; background: #f8f0db; border-radius: 9px; }
    .meter-info { flex: 1; }
    .meter-name { font-size: 11px; font-weight: 600; }
    .meter-status { font-size: 10px; color: var(--muted); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #67a884; }
    .lost-feature { display: grid; grid-template-columns: 105px 1fr; gap: 13px; align-items: center; }
    .lost-image { width: 105px; height: 85px; object-fit: cover; border-radius: 8px; background: #e7ebe4; }
    .lost-title { font-size: 12px; font-weight: 700; }
    .lost-copy { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .lost-date { margin-top: 8px; color: #9aa39d; font-size: 10px; }
    .page-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 20px 0 16px; }
    .search-box { width: min(320px, 100%); height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 11px; background: white; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
    .search-box input { width: 100%; outline: 0; border: 0; background: transparent; color: var(--ink); font-size: 12px; }
    .song-list { display: grid; }
    .song-row { min-height: 70px; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; align-items: center; gap: 13px; padding: 11px 17px; border-bottom: 1px solid #edf0ec; }
    .song-row:last-child { border-bottom: 0; }
    .song-index { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; background: #f5f6f2; color: #89948c; font-size: 11px; }
    .song-title { font-size: 12px; font-weight: 700; }
    .song-byline { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .song-actions { display: flex; gap: 6px; }
    .song-actions a, .song-actions button { min-width: 32px; height: 31px; display: inline-grid; place-items: center; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; background: #fff; text-decoration: none; color: var(--green); cursor: pointer; font-size: 11px; }
    .song-actions a:hover, .song-actions button:hover { background: var(--green-pale); }
    .month-switch { display: flex; align-items: center; gap: 10px; }
    .month-title { min-width: 135px; text-align: center; font-size: 15px; font-weight: 700; }
    .calendar { overflow: hidden; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .calendar-weekday { padding: 11px 5px; background: #fafbf9; border-bottom: 1px solid var(--line); color: var(--muted); text-align: center; font-size: 10px; font-weight: 600; }
    .calendar-day { position: relative; min-height: 92px; padding: 9px 8px; border-right: 1px solid #edf0ec; border-bottom: 1px solid #edf0ec; cursor: pointer; }
    .calendar-day:nth-child(7n) { border-right: 0; }
    .calendar-day:hover { background: #fafcf9; }
    .calendar-day.outside { color: #b9c0ba; background: #fbfcfb; }
    .calendar-day.selected { background: #f0f7f2; box-shadow: inset 0 0 0 2px var(--green); }
    .calendar-number { font-size: 11px; font-weight: 600; }
    .calendar-event { margin-top: 6px; overflow: hidden; padding: 3px 5px; border-radius: 4px; background: #e8f2ed; color: #326b58; white-space: nowrap; text-overflow: ellipsis; font-size: 9px; }
    .calendar-event.absence { background: #fff0e8; color: #a35b44; }
    .calendar-detail { margin-top: 16px; }
    .detail-empty { padding: 19px 0; color: var(--muted); text-align: center; font-size: 12px; }
    .detail-row { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid #edf0ec; }
    .detail-row:last-child { border: 0; }
    .detail-time { width: 48px; color: var(--green); font-size: 11px; font-weight: 700; }
    .request-list { display: grid; }
    .request-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 15px; align-items: center; padding: 15px 18px; border-bottom: 1px solid #edf0ec; }
    .request-row:last-child { border: 0; }
    .request-title { font-size: 12px; font-weight: 700; }
    .request-copy { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .request-meta { display: flex; gap: 8px; align-items: center; margin-top: 7px; color: #929d95; font-size: 10px; }
    .request-state { padding: 4px 8px; border-radius: 99px; background: #fff3dc; color: #987025; font-size: 9px; white-space: nowrap; }
    .request-state.approved { background: #e7f2eb; color: #397154; }
    .request-state.rejected { background: #fae9e5; color: #a55242; }
    .inline-actions { display: flex; gap: 6px; }
    .admin-grid { grid-template-columns: minmax(0, 1.3fr) minmax(260px, .8fr); align-items: start; }
    .member-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #edf0ec; }
    .member-row:last-child { border: 0; }
    .member-role { margin-left: auto; color: var(--muted); font-size: 10px; }
    .switch { position: relative; width: 34px; height: 20px; border: 0; border-radius: 99px; background: #d7ddd8; cursor: pointer; }
    .switch:after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: white; transition: transform .18s ease; }
    .switch.on { background: var(--green); }
    .switch.on:after { transform: translateX(14px); }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #52635a; font-size: 11px; font-weight: 600; }
    .field input, .field select, .field textarea { width: 100%; min-height: 39px; padding: 9px 10px; border: 1px solid #dfe5de; border-radius: 7px; outline: 0; background: white; color: var(--ink); font-size: 12px; }
    .field textarea { min-height: 86px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #74a48d; box-shadow: 0 0 0 3px rgba(69,135,105,.1); }
    .theme-preview { min-height: 90px; display: grid; align-content: center; gap: 4px; margin: 13px 0; padding: 15px; border: 1px solid var(--line); border-radius: 8px; }
    .theme-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .color-field { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 10px; }
    .color-field input { width: 35px; height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: white; cursor: pointer; }
    .empty-state { padding: 35px 15px; color: var(--muted); text-align: center; font-size: 12px; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(20, 38, 32, .42); }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(520px, 100%); max-height: min(90vh, 760px); overflow: auto; background: white; border-radius: 12px; box-shadow: 0 25px 80px rgba(14,32,25,.22); animation: rise .2s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 17px 20px; border-bottom: 1px solid var(--line); }
    .modal-title { font-size: 15px; font-weight: 700; }
    .modal-body { padding: 19px 20px 21px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .reason-options { display: flex; flex-wrap: wrap; gap: 7px; }
    .reason-option { padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: white; color: #66736c; cursor: pointer; font-size: 11px; }
    .reason-option.selected { border-color: var(--green); background: var(--green-pale); color: var(--green); }
    .clock-controls { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 14px 0; }
    .clock-dial { width: 190px; height: 190px; position: relative; border: 1px solid #dfe7df; border-radius: 50%; background: #f7faf7; }
    .clock-center { position: absolute; top: 50%; left: 50%; width: 9px; height: 9px; border-radius: 50%; background: var(--green); transform: translate(-50%,-50%); }
    .clock-hand { position: absolute; top: 50%; left: 50%; width: 2px; height: 60px; background: var(--green); transform-origin: 50% 0; }
    .clock-number { position: absolute; width: 30px; height: 30px; margin: -15px; border: 0; border-radius: 50%; background: transparent; color: #496258; cursor: pointer; font-size: 11px; }
    .clock-number.selected { color: white; background: var(--green); }
    .ampm { display: grid; gap: 7px; }
    .ampm button { border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; background: white; cursor: pointer; font-size: 11px; }
    .ampm button.selected { background: var(--green-pale); color: var(--green); border-color: #a8c6b6; }
    .clock-hint { color: var(--muted); text-align: center; font-size: 10px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 80; max-width: min(370px, calc(100vw - 32px)); padding: 12px 16px; background: #1d3831; color: white; border-radius: 8px; box-shadow: var(--shadow); font-size: 12px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .auth-gate { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; background: var(--page); }
    .auth-gate[hidden] { display: none; }
    .auth-panel { width: min(410px, 100%); margin-block: auto; flex: 0 0 auto; padding: 30px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
    .auth-panel h1 { margin-top: 20px; font-size: 22px; }
    .auth-message { margin: 8px 0 20px; color: var(--muted); font-size: 12px; }
    .auth-error { margin-top: 13px; color: #b65743; font-size: 11px; }
    .auth-panel .primary-button { width: 100%; }
    .auth-mode-options { display: grid; gap: 8px; }
    .auth-mode-option { display: flex; align-items: flex-start; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfa; }
    .auth-mode-option input { margin-top: 3px; }
    .invite-code { font-size: 20px; font-weight: 700; letter-spacing: .12em; }
    .drawer-scrim { display: none; }
    @media (max-width: 1050px) {
      .sidebar { width: 226px; }
      .main { margin-left: 226px; }
      .content { padding-right: 25px; padding-left: 25px; }
      .topbar { padding: 0 25px; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .sidebar { width: min(300px, 86vw); transform: translateX(-100%); box-shadow: none; }
      .sidebar.open { transform: translateX(0); box-shadow: 20px 0 50px rgba(24,46,36,.12); }
      .drawer-scrim.open { display: block; position: fixed; inset: 0; z-index: 19; background: rgba(21,37,31,.32); }
      .main { margin-left: 0; }
      .topbar { height: 62px; padding: 0 16px; }
      .mobile-menu { display: inline-grid; place-items: center; margin-right: 9px; }
      .top-left { display: flex; align-items: center; }
      .today-label { display: none; }
      .content { padding: 23px 15px 38px; }
      .welcome-row { align-items: flex-start; flex-direction: column; gap: 12px; }
      h1 { font-size: clamp(20px, 5vw, 22px); }
      .eyebrow { font-size: 12px; }
      .subheading { font-size: 13px; }
      .welcome-row > .primary-button { padding: 0 14px; font-size: 13px; }
      .stat-top { font-size: 12px; }
      .stat-foot, .panel-note { font-size: 11px; }
      .field label { font-size: 12px; }
      .field input, .field select, .field textarea { font-size: 16px; }
      .home-grid, .admin-grid { grid-template-columns: 1fr; }
      .calendar-day { min-height: 70px; padding: 6px 4px; }
      .calendar-event { padding: 2px; font-size: 8px; }
      .song-row { grid-template-columns: 34px minmax(0,1fr) auto; gap: 8px; padding: 10px; }
      .song-actions { gap: 4px; }
      .song-actions a, .song-actions button { min-width: 29px; padding: 0 6px; }
    }
    @media (max-width: 440px) {
      .stats-grid { gap: 9px; }
      .stat-card { min-height: 100px; padding: 12px; }
      .stat-number { font-size: 21px; }
      .welcome-row { gap: 10px; }
      .auth-panel { padding: 24px 20px; }
      .page-toolbar { align-items: flex-start; flex-direction: column; }
      .search-box { width: 100%; }
      .field-grid { grid-template-columns: 1fr; }

      return `<form id="lostForm" class="field-grid"><div class="field full"><label for="lostTitle">落とし物・拾得物</label><input id="lostTitle" required placeholder="例：黒い譜面ファイル"></div><div class="field full"><label for="lostPlace">場所・状況</label><textarea id="lostPlace" placeholder="見つけた場所、特徴など"></textarea></div><div class="field full"><label for="lostPhoto">写真を添付</label><input id="lostPhoto" type="file" accept="image/*"><img id="lostPreview" alt="写真プレビュー" style="display:none;max-width:100%;max-height:180px;object-fit:contain;border-radius:8px"></div><div class="field full"><div class="modal-footer"><button type="button" class="secondary-button" data-action="close-modal">キャンセル</button><button type="submit" class="primary-button">報告を送信</button></div></div></form>`;
    }
    function openAbsence() {
      selectedReason = '体調不良';
      absenceKind = '欠席';
      openModal('遅刻・欠席連絡', formMarkup('absence'));
      const dial = document.getElementById('clockDial');
      for (let hour=1; hour<=12; hour++) {
        const angle = (hour*30-90)*Math.PI/180, radius=72;
        const button = document.createElement('button'); button.type='button'; button.className=`clock-number ${hour===clockHour?'selected':''}`; button.textContent=hour;
        button.style.left=`${95+Math.cos(angle)*radius}px`; button.style.top=`${95+Math.sin(angle)*radius}px`;
        button.addEventListener('click', () => { clockHour=hour; dial.querySelectorAll('.clock-number').forEach(item=>item.classList.toggle('selected', Number(item.textContent)===hour)); document.getElementById('clockHand').style.transform=`rotate(${hour*30}deg)`; document.getElementById('clockHint').textContent=`${clockPeriod} ${hour}:00 頃に到着予定`; });
        dial.appendChild(button);
      }
      document.getElementById('clockHand').style.transform=`rotate(${clockHour*30}deg)`;
      document.getElementById('arrivalField').hidden = absenceKind !== '遅刻';
    }
    function openSongModal(song = null) {
      const editing = Boolean(song);
      openModal(editing?'曲を編集':'ライブラリに曲を追加', `<form id="songForm" class="field-grid"><div class="field full"><label for="songTitle">曲名</label><input id="songTitle" required value="${escapeHtml(song?.title||'')}" placeholder="例：宝島"></div><div class="field full"><label for="songByline">作曲・編曲者</label><input id="songByline" required value="${escapeHtml(song?.byline||'')}" placeholder="作曲者 / 編曲者"></div><div class="field full"><label for="songSort">並び替え用の読み（ローマ字）</label><input id="songSort" value="${escapeHtml(song?.sortKey||'')}" placeholder="例：Takarajima"></div><div class="field full"><label for="songDrive">Google Driveの楽譜URL</label><input id="songDrive" type="url" value="${escapeHtml(song?.drive||'')}" placeholder="https://drive.google.com/..."></div><div class="field full"><label for="songYoutube">YouTube参考音源URL</label><input id="songYoutube" type="url" value="${escapeHtml(song?.youtube||'')}" placeholder="https://www.youtube.com/..."></div><div class="field full"><label for="songAudio">音源ファイル ${song?.audioKey?'（新しいファイルを選ぶと差し替え）':''}</label><input id="songAudio" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg"></div><div class="field full"><div class="modal-footer"><button type="button" class="secondary-button" data-action="close-modal">キャンセル</button><button type="submit" class="primary-button">保存</button></div></div></form>`);
    }
    function openRequestForm(type) {
      const titles = { absence: '遅刻・欠席連絡', purchase: '購入・修理希望', lost: '落とし物を報告' };
      if (type === 'absence') openAbsence(); else openModal(titles[type], formMarkup(type));
    }
    function handleClick(event) {
      const target = event.target.closest('button, a, .calendar-day');
      if (!target) return;
      if (target.dataset.authAction === 'toggle-mode') { authMode=authMode==='signin'?'signup':'signin'; authMessage=''; renderAuthGate(); return; }
      if (target.dataset.authAction === 'sign-out' || target.id === 'signOutButton') {
        supabaseClient.auth.signOut().then(({ error }) => { if(error) showToast('ログアウトに失敗しました'); });
        return;
      }
      if (target.dataset.page) { activePage=target.dataset.page; render(); closeDrawer(); return; }
      if (target.dataset.form) { openRequestForm(target.dataset.form); closeDrawer(); return; }
      if (target.dataset.action === 'close-modal') { closeModal(); return; }
      if (target.dataset.kind) { absenceKind=target.dataset.kind; document.querySelectorAll('.kind-option').forEach(item=>item.classList.toggle('selected',item.dataset.kind===absenceKind)); document.getElementById('arrivalField').hidden=absenceKind!=='遅刻'; return; }
      if (target.dataset.reason) { selectedReason=target.dataset.reason; document.querySelectorAll('#reasonOptions .reason-option').forEach(item=>item.classList.toggle('selected',item.dataset.reason===selectedReason)); const arrival = document.getElementById('arrivalField'); if(arrival) arrival.hidden=absenceKind!=='遅刻'; return; }
      if (target.dataset.period) { clockPeriod=target.dataset.period; document.querySelectorAll('[data-period]').forEach(item=>item.classList.toggle('selected',item.dataset.period===clockPeriod)); document.getElementById('clockHint').textContent=`${clockPeriod} ${clockHour}:00 頃に到着予定`; return; }
      if (target.dataset.month) { if(target.dataset.month==='today') calendarDate=new Date(); else calendarDate.setMonth(calendarDate.getMonth()+Number(target.dataset.month)); renderCalendar(); return; }
      if (target.classList.contains('calendar-day')) { selectedDate=target.dataset.date; renderCalendar(); return; }
      if (target.dataset.action==='request-status') { updateReportStatus(target.dataset.id, target.dataset.status).catch(showDatabaseError); return; }
      if (target.dataset.action==='member-role') { updateMemberRole(target.dataset.index).catch(showDatabaseError); return; }
      if (target.dataset.action==='save-theme') { saveTheme().catch(showDatabaseError); return; }
      if (target.dataset.action==='add-song') { openSongModal(); return; }
      if (target.dataset.action==='edit-song') { const song=data.songs.find(item=>item.id===target.dataset.id); if(song) openSongModal(song); return; }
      if (target.dataset.action==='play-song') { playSong(target.dataset.id); return; }
      if (target.dataset.action==='copy-invite-code') {
        if (!navigator.clipboard?.writeText) { showToast('コピーできません。招待コードを選択してコピーしてください。'); return; }
        navigator.clipboard.writeText(data.inviteCode).then(() => showToast('招待コードをコピーしました')).catch(error => showDatabaseError(error));
        return;
      }
      if (target.id==='menuButton') { openDrawer(); return; }
      if (target.id==='noticeButton') { openRequestForm('absence'); return; }
      if (target.id==='clubSwitch') { showToast(`${data.schoolName} · ${data.clubName}`); return; }
    }
    function openDrawer() { document.getElementById('sidebar').classList.add('open'); document.getElementById('scrim').classList.add('open'); }
    function closeDrawer() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }
    function showDatabaseError(error) {
      console.error('Supabase operation failed', error);
      showToast(error?.message || 'Supabaseへの保存に失敗しました');
    }
    async function updateReportStatus(id, uiStatus) {
      const status = uiStatus === '却下' ? 'rejected' : 'resolved';
      checkedData(await supabaseClient.from('reports').update({ status }).eq('id', id).eq('school_id', data.schoolId));
      await loadWorkspace(currentSession.user);
      showToast(`投稿を「${reportStatusLabel(status)}」にしました`);
    }
    async function updateMemberRole(index) {
      const member = data.members[Number(index)];
      if (!member) return;
      checkedData(await supabaseClient.from('profiles').update({ is_admin: !member.role }).eq('id', member.id).eq('school_id', data.schoolId));
      await loadWorkspace(currentSession.user);
      showToast(`${member.name}の権限を更新しました`);
    }
    async function saveTheme() {
      const theme = { page: document.getElementById('themePage').value, ink: document.getElementById('themeInk').value, font: document.getElementById('themeFont').value };
      checkedData(await supabaseClient.from('club_settings').upsert({ school_id: data.schoolId, theme_page: theme.page, theme_ink: theme.ink, theme_font: theme.font }, { onConflict: 'school_id' }));
      data.theme = theme;
      render();
      showToast('団体のデザインを保存しました');
    }
    async function requestEntry(kind, title, reason, date=dayKey(new Date()), arrivalAt=null, photoFile=null) {
      let photoPath = null;
      if (photoFile) {
        const safeName = photoFile.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        photoPath = `${data.schoolId}/${crypto.randomUUID()}-${safeName}`;
        const upload = await supabaseClient.storage.from('report-photos').upload(photoPath, photoFile, { contentType: photoFile.type, upsert: false });
        if (upload.error) throw upload.error;
      }
      checkedData(await supabaseClient.from('reports').insert({ school_id: data.schoolId, kind, report_date: date, title, reason, arrival_at: arrivalAt, photo_url: photoPath }));
      closeModal();
      await loadWorkspace(currentSession.user);
      showToast('連絡を送信しました');
    }
    async function playSong(id) {
      const song=data.songs.find(item=>item.id===id); if(!song?.audioKey) return;
      const { data: signed, error } = await supabaseClient.storage.from('song-audio').createSignedUrl(song.audioKey, 3600);
      if (error) { showDatabaseError(error); return; }
      let player=document.getElementById('audioPlayer'); if(!player){player=document.createElement('audio');player.id='audioPlayer';player.controls=true;player.style='position:fixed;left:50%;bottom:18px;z-index:40;width:min(420px,calc(100vw - 30px));transform:translateX(-50%)';document.body.appendChild(player);} player.src=signed.signedUrl; player.play(); showToast(`再生中：${song.title}`);
    }
    document.addEventListener('click', handleClick);
    document.getElementById('scrim').addEventListener('click', closeDrawer);
    modalBackdrop.addEventListener('click', event => { if(event.target===modalBackdrop) closeModal(); });
    document.addEventListener('keydown', event => { if(event.key==='Escape'){closeModal();closeDrawer();} });
    document.addEventListener('change', event => {
      if (event.target.name === 'registrationMode') { signupType = event.target.value; renderAuthGate(); return; }
      if(event.target.id==='lostPhoto' && event.target.files[0]) { const reader=new FileReader();reader.onload=()=>{const preview=document.getElementById('lostPreview');preview.src=reader.result;preview.style.display='block';};reader.readAsDataURL(event.target.files[0]); }
    });
    document.addEventListener('submit', async event => {
      event.preventDefault(); const form=event.target;
      if (form.id === 'authForm') {
        const values = new FormData(form);
        const email = String(values.get('email') || '').trim();
        const password = String(values.get('password') || '');
        const authError = document.getElementById('authError');
        if (authError) authError.textContent = '';
        try {
          if (authMode === 'signup') {
            const registrationMode = String(values.get('registrationMode') || '');
            const metadata = { registration_mode: registrationMode };
            if (registrationMode === 'create') {
              metadata.school_name = String(values.get('schoolName') || '').trim();
              metadata.club_name = String(values.get('clubName') || '').trim();
              metadata.full_name = `${metadata.school_name} ${metadata.club_name} 管理者`;
            } else if (registrationMode === 'join') {
              metadata.full_name = String(values.get('fullName') || '').trim();
              if (!metadata.full_name) throw new Error('氏名を入力してください。');
              const partPrimary = String(values.get('partPrimary') || '').trim();
              const partSecondary = String(values.get('partSecondary') || '').trim();
              metadata.part = [partPrimary, partSecondary].filter(Boolean).join(' / ');
              metadata.invite_code = String(values.get('inviteCode') || '').trim().toUpperCase();
            } else {
              throw new Error('登録方法を選択してください。');
            }
            const { data: signUpData, error } = await supabaseClient.auth.signUp({ email, password, options: { data: metadata } });
            if (error) throw error;
            if (signUpData.session) await applySession(signUpData.session);
            else {
              authMode = 'signin';
              authMessage = '登録を受け付けました。確認メールのリンクを開いてからログインしてください。';
              renderAuthGate();
            }
          } else {
            const { data: signInData, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw error;
            await applySession(signInData.session);
          }
        } catch (error) {
          if (authError) authError.textContent = error.message || '認証に失敗しました。入力内容をご確認ください。';
        }
        return;
      }
      try {
        if(form.id==='absenceForm') {
          const date=new FormData(form).get('date');
          const note=document.getElementById('absenceNote').value.trim();
          const arrivalHour=clockHour%12+(clockPeriod==='午後'?12:0);
          const arrivalAt=absenceKind==='遅刻'?`${String(arrivalHour).padStart(2,'0')}:00:00`:null;
          const title=absenceKind==='遅刻'?'練習に遅刻します':'練習を欠席します';
          const reason=`${selectedReason}${note?` · ${note}`:''}`;
          await requestEntry('absence',title,reason,date,arrivalAt);
          return;
        }
        if(form.id==='purchaseForm') {
          const title=document.getElementById('purchaseTitle').value.trim();
          const reason=`${document.getElementById('purchaseCategory').value} · ${document.getElementById('purchaseUrgency').value} · ${document.getElementById('purchaseBody').value.trim()}`;
          await requestEntry('purchase_repair',title,reason);
          return;
        }
        if(form.id==='lostForm') {
          const title=document.getElementById('lostTitle').value.trim();
          const reason=document.getElementById('lostPlace').value.trim();
          await requestEntry('lost_found',title,reason,dayKey(new Date()),null,document.getElementById('lostPhoto').files[0]||null);
          return;
        }
        if(form.id==='songForm') {
          const file=document.getElementById('songAudio').files[0];
          const existingId=form.dataset.id;
          const songRow={title:document.getElementById('songTitle').value.trim(),sort_reading:document.getElementById('songSort').value.trim()||document.getElementById('songTitle').value.trim(),composer:document.getElementById('songByline').value.trim(),arranger:null,drive_url:document.getElementById('songDrive').value.trim()||null,youtube_url:document.getElementById('songYoutube').value.trim()||null};
          let songId=existingId;
          if(existingId) checkedData(await supabaseClient.from('songs').update(songRow).eq('id',existingId).eq('school_id',data.schoolId));
          else songId=checkedData(await supabaseClient.from('songs').insert({...songRow,school_id:data.schoolId}).select('id').single()).id;
          if(file) {
            const path=`${data.schoolId}/${songId}.audio`;
            const upload=await supabaseClient.storage.from('song-audio').upload(path,file,{contentType:file.type,upsert:true});
            if(upload.error) throw upload.error;
            checkedData(await supabaseClient.from('songs').update({audio_file_path:path}).eq('id',songId).eq('school_id',data.schoolId));
          }
          closeModal(); await loadWorkspace(currentSession.user); showToast('ライブラリを更新しました'); return;
        }
        if(form.id==='eventForm') {
          const startsAt=new Date(`${document.getElementById('eventDate').value}T${document.getElementById('eventTime').value}:00+09:00`).toISOString();
          checkedData(await supabaseClient.from('schedules').insert({school_id:data.schoolId,title:document.getElementById('eventTitle').value.trim(),content:document.getElementById('eventDetail').value.trim(),starts_at:startsAt,location:document.getElementById('eventPlace').value.trim()}));
          await loadWorkspace(currentSession.user); showToast('練習予定を追加しました'); return;
        }
        if(form.id==='noticeForm') {
          checkedData(await supabaseClient.from('announcements').insert({school_id:data.schoolId,author_id:currentProfile.id,title:document.getElementById('noticeTitle').value.trim(),body:document.getElementById('noticeBody').value.trim()}));
          await loadWorkspace(currentSession.user); showToast('全体連絡を投稿しました');
        }
      } catch (error) { showDatabaseError(error); }
    });
    document.addEventListener('click', event => { if(event.target.id==='scrim') closeDrawer(); });
    const originalOpenSongModal = openSongModal;
    openSongModal = function(song = null) { originalOpenSongModal(song); const form=document.getElementById('songForm'); if(song){form.dataset.id=song.id;form.dataset.audioKey=song.audioKey||'';} };
    supabaseClient.auth.onAuthStateChange((_event, session) => {
      window.setTimeout(() => applySession(session), 0);
    });
    supabaseClient.auth.getSession().then(({ data: sessionData, error }) => {
      if (error) { authMessage = 'Supabase Authに接続できませんでした。'; render(); return; }
      applySession(sessionData.session);
    });
    render();
  </script>
</body>
</html>
